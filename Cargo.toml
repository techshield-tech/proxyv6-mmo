[package]
name = "proxyv6-mmo"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.37"
netdev = { version = "0.48", default-features = false, features = ["gateway"] }
rand = "0.9"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
arboard = "3"
rfd = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
